name: "2. Application CI/CD (via Makefile)"

on:
  workflow_dispatch: # Permite ejecutar manualmente con un botón en GitHub
  push:
    branches: [ "master" ]
    paths:
      - 'app/**'
      - 'aks/**'
      - 'Dockerfile'
      - 'Makefile'
      - 'requirements.txt'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'app/**'
      - 'Dockerfile'
      - 'requirements.txt'

permissions:
  id-token: write
  contents: read

# Variables que se inyectan directamente a los targets de tu Makefile
env:
  RESOURCE_GROUP: "devsu-rg-aks"
  AKS_CLUSTER: "devsu-aks-cluster"
  ACR_NAME: "devsuacr"
  ACR_SERVER: "devsuacr.azurecr.io"
  IMAGE_NAME: "demo-devops-python"
  IMAGE_TAG: ${{ github.sha }}
  NAMESPACE: "devsu-app"

jobs:
  # ============================================================================
  # ETAPA 1: Análisis Estático, Pruebas Unitarias y Cobertura (Requerido en el reto)
  # ============================================================================
  test-and-coverage:
    name: "Code Quality & Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt flake8 coverage

      - name: Análisis Estático de Código (Flake8)
        run: |
          # Falla si hay errores críticos de sintaxis o variables no definidas
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Advertencias de estilo PEP8
          flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Pruebas Unitarias y Cobertura (Coverage)
        env:
          DJANGO_SECRET_KEY: "ci-test-temporary-secret-key-12345"
          DB_ENGINE: "sqlite"
          DATABASE_NAME: "ci_test.sqlite3"
        run: |
          cd app
          coverage run --source='api' manage.py test api
          coverage report -m
          coverage xml -o ../coverage.xml

      - name: Guardar reporte de cobertura como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ============================================================================
  # ETAPA 2: Compilación y Push a Azure Container Registry (via Make)
  # ============================================================================
  build-and-push:
    name: "Build & Push via Makefile"
    needs: test-and-coverage
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en Azure (OIDC Passwordless)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ejecutar make app-build-push
        run: make app-build-push

      # Escaneo de vulnerabilidades (Opcional solicitado en la consigna)
      - name: Escaneo de Vulnerabilidades de Imagen con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ACR_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  # ============================================================================
  # ETAPA 3: Despliegue en AKS con Migraciones y Verificación (via Make)
  # ============================================================================
  deploy:
    name: "Deploy to AKS via Makefile"
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Iniciar sesión en Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ejecutar make app-deploy
        run: make app-deploy

      - name: Smoke Test (Dinámico y Simplificado)
        run: |
          echo "Esperando a que el balanceador de Azure esté listo..."
          
          # Bucle único: Espera la IP y prueba el endpoint automáticamente
          for i in {1..6}; do
            # Extrae la IP en vivo
            IP=$(kubectl get svc demo-api-service -n devsu-app -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            
            if [ -n "$IP" ]; then
              echo "🌐 IP detectada: $IP. Probando conexión..."
              if curl -f -s "http://$IP/api/users/"; then
                echo -e "\n✅ ¡Smoke Test exitoso!"
                exit 0
              fi
            fi
            
            echo "Intento $i/6: Esperando a que la API responda... reintentando en 10s"
            sleep 10
          done
          
          echo "❌ Error: El Smoke Test falló o expiró el tiempo de espera."
          exit 1