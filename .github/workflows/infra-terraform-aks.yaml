name: "1. Infrastructure (Terraform AKS via Make)"

on:
  workflow_dispatch: # allows manual execution of the workflow
  push:
    branches: [ "main" ]
    paths:
      - 'terraform/**'
      - 'Makefile'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'terraform/**'
      - 'Makefile'

# OIDC permissions for Azure login
permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: "Terraform Execution via Makefile"
    runs-on: ubuntu-latest

    #### enviroment variables for Terraform backend configuration
    env:
      AZURE_LOCATION: "eastus2"
      TF_PREFIX: "devsu"
      TF_STATE_RG: "rg-terraform-state-devsu" 
      TF_STATE_STORAGE_ACCOUNT: "tfstatertenesacadevsu" 
      TF_STATE_CONTAINER: "tfstate"
      TF_STATE_KEY: "aks.terraform.tfstate"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"

    steps:
      #### Checkout del código and setup Terraform CLI
      - name: Code Checkout 
        uses: actions/checkout@v4

      - name: setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      #### Azure login via OIDC (Passwordless)
      - name: Azure login via OIDC (Passwordless)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      #### create backend to store terraform state
      - name: create backend resource group and storage account for Terraform state
        run: make backend-init
      
      #### Terraform Init and Plan via Makefile

      - name: Terraform Init (via Make)
        run: make tf-init
      
      - name: Terraform Format (via Make)
        run: make tf-fmt
      
      - name: Terraform Validate (via Make)
        run: make tf-validate
      
      - name: Terraform Plan (via Make)
        run: make tf-plan

      # El Apply solo se ejecuta si se hace merge/push a main, no en Pull Requests
      - name: Terraform Apply (via Make)
       # if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: make tf-apply