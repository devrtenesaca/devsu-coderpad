apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api-deployment
  labels:
    app: demo-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-api
  template:
    metadata:
      labels:
        app: demo-api
    spec:
      # Seguridad: Contenedor sin privilegios de root (UID 10001)
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: devsuacr.azurecr.io/demo-devops-python:latest # ACR Azure 
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: demo-api-config
            - secretRef:
                name: demo-api-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          # Verifica que el contenedor responda
          livenessProbe:
            httpGet:
              path: /api/users/
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          # Verifica que esté listo para recibir tráfico
          readinessProbe:
            httpGet:
              path: /api/users/
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10