apiVersion: batch/v1
kind: Job
metadata:
  name: django-migration-job
spec:
  ttlSecondsAfterFinished: 100
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migration
          image: devsuacr.azurecr.io/demo-devops-python:latest
          imagePullPolicy: Always
          command: ["python", "manage.py", "migrate"]
          envFrom:
            - configMapRef:
                name: demo-api-config
            - secretRef:
                name: demo-api-secret